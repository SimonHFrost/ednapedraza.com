<!doctype html>
<!-- STYLE 1 copy of proximamente.html: the previous design, shown when a visitor picks
     Style 1 (js/style-switch.js). Keep its content in step with proximamente.html. -->
<!-- Tienda: "coming soon" page. The home menu's Shop link opens it on a
     tap; pressing and holding that link opens tienda.html (js/shop-link.js).
     Reuses the store page's hero styles from css/store.css. -->
<html lang="es" class="no-js" data-style-only="1" data-style-alt="/proximamente">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Tienda: muy pronto — Edna Pedraza</title>
  <meta name="description" content="La tienda de Edna Pedraza abre muy pronto, con un primer drop de edición limitada hecho en CDMX.">
  <meta name="theme-color" content="#fcfaf5">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="assets/img/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
  <link rel="preload" href="assets/fonts/dm-serif-display-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/dm-sans-latin-opsz-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/styles-1.css">
  <link rel="stylesheet" href="css/store-1.css">
  <script src="/js/style-switch.js"></script>
  <script>document.documentElement.className = document.documentElement.className.replace('no-js', 'js');</script>
  <script src="js/main.js" defer></script>
  <script src="js/store-1.js" defer></script>
</head>
<body class="page-store page-soon" data-page="store">
  <a class="skip-link" href="#main">Saltar al contenido</a>

  <header class="site-header">
    <a class="brand brand--plain" href="/">
      <p class="brand__name">Edna Pedraza</p>
    </a>

    <nav class="site-menu" id="site-menu" aria-label="Principal">
      <ul class="site-menu__list">
        <li class="site-menu__item"><a class="site-menu__link" href="/about"><span class="site-menu__label">About</span></a></li>
        <li class="site-menu__item"><a class="site-menu__link" href="/#contacto"><span class="site-menu__label">Contact</span></a></li>
        <li class="site-menu__item"><a class="site-menu__link" href="/direccion-creativa"><span class="site-menu__label">Creative direction</span></a></li>
        <li class="site-menu__item"><a class="site-menu__link" href="/fashion-styling"><span class="site-menu__label">Fashion styling</span></a></li>
        <li class="site-menu__item"><a class="site-menu__link" href="/direccion-de-arte"><span class="site-menu__label">Art direction</span></a></li>
      </ul>
    </nav>
  </header>

  <main id="main" class="store" tabindex="-1">
    <section class="drop-hero soon-hero" aria-labelledby="soon-title">
      <figure class="drop-stage">
        <svg class="drop-stage__flower" viewBox="0 0 64 64" aria-hidden="true" focusable="false">
          <g fill="currentColor"><circle cx="32" cy="16" r="13"/><circle cx="47.22" cy="27.06" r="13"/><circle cx="41.4" cy="44.94" r="13"/><circle cx="22.6" cy="44.94" r="13"/><circle cx="16.78" cy="27.06" r="13"/></g>
        </svg>
        <img class="drop-stage__img" src="assets/img/tote-flor.jpg"
             srcset="assets/img/tote-flor-600.jpg 600w, assets/img/tote-flor.jpg 1016w"
             sizes="(max-width: 809.98px) 100vw, 52vw" width="1016" height="1020"
             fetchpriority="high" decoding="async"
             alt="Tote de lona color crudo con flores silvestres bordadas, sobre fondo rosa.">
        <p class="drop-badge" aria-hidden="true"><span class="drop-badge__num">01</span><span class="drop-badge__text">Primer drop</span></p>
        <p class="drop-stage__tag ui-label" aria-hidden="true">Hecho en CDMX</p>
      </figure>

      <div class="drop-panel">
        <p class="drop-kicker ui-label">Tienda · Próximamente</p>
        <h1 class="drop-title" id="soon-title">Muy pronto</h1>
        <p class="drop-standfirst">Primer drop: una tote de edición limitada.</p>

        <a class="buy-button" href="https://www.instagram.com/ednamiau/" rel="noopener">
          <span class="buy-button__label">Entérate primero</span>
          <span class="buy-button__price">@ednamiau <span aria-hidden="true">→</span></span>
        </a>

      </div>
    </section>
  </main>

  <footer class="store-footer">
    <a class="store-footer__back ui-label" href="/"><span aria-hidden="true">←</span> Volver al portafolio</a>
    <ul class="store-footer__tags">
      <li><a class="store-footer__tag" href="mailto:edna.sapi@gmail.com?subject=Tienda"><span class="store-footer__label">edna.sapi@gmail.com</span></a></li>
      <li><a class="store-footer__tag" href="https://www.instagram.com/ednamiau/" rel="noopener"><span class="store-footer__label">@ednamiau</span></a></li>
    </ul>
  </footer>
</body>
</html>

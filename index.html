<!doctype html>
<html lang="es" class="no-js">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Edna Pedraza</title>
  <meta name="description" content="Edna Pedraza, Directora Creativa y Estilista de Moda: selección de proyectos de dirección creativa, estilismo y dirección de arte.">
  <meta name="theme-color" content="#f2ce3d">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="assets/img/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
  <link rel="preload" href="assets/fonts/dm-serif-display-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/dm-sans-latin-opsz-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/styles.css">
  <script>document.documentElement.className = document.documentElement.className.replace('no-js', 'js');</script>
  <script src="js/data.js" defer></script>
  <script src="js/main.js" defer></script>
</head>
<body class="page-home" data-page="home">
  <a class="skip-link" href="#main">Saltar al contenido</a>

  <div class="home-bg" data-home-bg aria-hidden="true"></div>

  <header class="site-header">
    <a class="brand" href="index.html">
      <h1 class="brand__name">Edna Pedraza</h1>
      <p class="brand__role">Directora Creativa y Estilista de Moda</p>
    </a>

    <nav class="site-menu" id="site-menu" aria-label="Principal">
      <ul class="site-menu__list">
        <li class="site-menu__item"><a class="site-menu__link" href="about.html"><span class="site-menu__label">About</span></a></li>
        <li class="site-menu__item"><a class="site-menu__link" href="index.html#contacto"><span class="site-menu__label">Contact</span></a></li>
        <li class="site-menu__item"><a class="site-menu__link" href="index.html?servicio=direccion-creativa"><span class="site-menu__label">Creative direction</span></a></li>
        <li class="site-menu__item"><a class="site-menu__link" href="index.html?servicio=fashion-styling"><span class="site-menu__label">Fashion styling</span></a></li>
        <li class="site-menu__item"><a class="site-menu__link" href="index.html?servicio=direccion-de-arte"><span class="site-menu__label">Art direction</span></a></li>
      </ul>
    </nav>
  </header>

  <main id="main" class="home" tabindex="-1">
    <h2 class="visually-hidden">Proyectos</h2>
    <ul class="work-list" data-work-list></ul>
    <ul class="work-grid" data-work-grid></ul>
    <noscript>
      <p class="noscript-note">La lista de proyectos necesita JavaScript. Actívalo para verla, o visita <a href="about.html">Sobre mí</a> y <a href="#contacto">Contacto</a>.</p>
    </noscript>

    <section class="contact" id="contacto" aria-labelledby="contacto-title">
      <div class="contact__intro">
        <h2 class="contact__title" id="contacto-title">¡Conectemos!</h2>
        <div class="contact__taglines">
          <p>De la idea al styling.</p>
          <p>¡Escríbeme y armamos algo!</p>
        </div>
        <ul class="contact__links">
          <li><a href="mailto:edna.sapi@gmail.com">edna.sapi@gmail.com</a></li>
          <li><a href="https://www.instagram.com/ednamiau/" rel="noopener">@ednamiau</a></li>
        </ul>
      </div>

        <!-- Posts to the site's Worker (worker/index.js), which emails Edna.
             main.js validates it and sends it with fetch; without JavaScript
             it posts as a normal page. -->
        <form class="contact-form" data-contact-form action="/api/contacto" method="post" aria-label="Formulario de contacto">
          <div class="field">
            <label class="field__label ui-label" for="f-nombre">Nombre</label>
            <input class="field__control" id="f-nombre" name="nombre" type="text" autocomplete="name"
                   placeholder="Nombre Apellido" required maxlength="100" aria-describedby="f-nombre-error"
                   data-required-message="Escribe tu nombre.">
            <p class="field__error ui-label" id="f-nombre-error"></p>
          </div>
          <div class="field">
            <label class="field__label ui-label" for="f-correo">Correo</label>
            <input class="field__control" id="f-correo" name="correo" type="email" autocomplete="email"
                   placeholder="nombre@ejemplo.com" required maxlength="254" pattern="[^\s@]+@[^\s@]+\.[^\s@]{2,}"
                   aria-describedby="f-correo-error"
                   data-required-message="Escribe tu correo.">
            <p class="field__error ui-label" id="f-correo-error"></p>
          </div>
          <div class="field">
            <label class="field__label ui-label" for="f-mensaje">Mensaje</label>
            <textarea class="field__control" id="f-mensaje" name="mensaje" placeholder="Cuéntame tu idea…"
                      required minlength="10" maxlength="5000" aria-describedby="f-mensaje-error" data-minlength="10"
                      data-required-message="Escribe un mensaje."></textarea>
            <p class="field__error ui-label" id="f-mensaje-error"></p>
          </div>
          <!-- Spam trap: hidden from people, but bots fill it in and the
               Worker then drops the message. -->
          <div class="visually-hidden" aria-hidden="true">
            <label for="f-sitio-web">Deja este campo vacío</label>
            <input id="f-sitio-web" name="sitio_web" type="text" tabindex="-1" autocomplete="off">
          </div>
          <button class="contact-form__submit" type="submit">Enviar</button>
          <p class="contact-form__status" data-form-status role="status" aria-live="polite"></p>
        </form>
    </section>
  </main>
</body>
</html>

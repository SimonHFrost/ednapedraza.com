<!doctype html>
<!-- Tienda: "coming soon" page. The home menu's Shop link opens it on a
     tap; pressing and holding that link opens tienda.html (js/shop-link.js).
     Reuses the store page's spread styles from css/store.css.
     Caption (data-placeholder="image-caption"): "Foto de referencia." says
     the picture is not the finished piece. Replace it with a real caption
     once Edna's own photograph is in, as on tienda.html. -->
<html lang="es" class="no-js">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tienda: muy pronto — Edna Pedraza</title>
  <meta name="description" content="La tienda de Edna Pedraza abre muy pronto, con una primera edición limitada hecha en CDMX.">
  <meta name="theme-color" content="#f6f1e6">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="assets/img/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
  <link rel="preload" href="assets/fonts/dm-serif-display-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/dm-sans-latin-opsz-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/store.css">
  <script>document.documentElement.className = document.documentElement.className.replace('no-js', 'js');</script>
  <script src="js/data.js" defer></script>
  <script src="js/main.js" defer></script>
  <script src="js/store.js" defer></script>
</head>
<body class="page-store page-soon" data-page="store">
  <a class="skip-link" href="#main">Saltar al contenido</a>

  <header class="site-header">
    <a class="brand brand--plain" href="index.html">
      <p class="brand__name">Edna Pedraza</p>
    </a>

    <nav class="site-menu" id="site-menu" aria-label="Principal">
      <ul class="site-menu__list" lang="en">
        <li class="site-menu__item"><a class="site-menu__link" href="about.html"><span class="site-menu__label">About</span></a></li>
        <li class="site-menu__item"><a class="site-menu__link" href="index.html#contacto"><span class="site-menu__label">Contact</span></a></li>
        <li class="site-menu__item"><a class="site-menu__link" href="index.html?servicio=direccion-creativa"><span class="site-menu__label">Creative direction</span></a></li>
        <li class="site-menu__item"><a class="site-menu__link" href="index.html?servicio=fashion-styling"><span class="site-menu__label">Fashion styling</span></a></li>
        <li class="site-menu__item"><a class="site-menu__link" href="index.html?servicio=direccion-de-arte"><span class="site-menu__label">Art direction</span></a></li>
      </ul>
    </nav>
  </header>

  <main id="main" class="store" tabindex="-1">
    <article class="drop" aria-labelledby="soon-title">
      <figure class="drop-photo">
        <img class="drop-photo__img" src="assets/img/tote-flor.jpg"
             srcset="assets/img/tote-flor-600.jpg 600w, assets/img/tote-flor.jpg 1016w"
             sizes="(max-width: 809.98px) 100vw, 52vw" width="1016" height="1020"
             fetchpriority="high" decoding="async"
             alt="Tote de lona color crudo con flores silvestres bordadas, sobre fondo rosa.">
        <figcaption class="drop-photo__caption" data-placeholder="image-caption">Foto de referencia.</figcaption>
      </figure>

      <div class="drop-text">
        <p class="drop-kicker">La tienda</p>
        <h1 class="drop-title" id="soon-title">Muy pronto</h1>
        <p class="drop-standfirst">La primera pieza: una tote bordada, de tiraje limitado.</p>
        <p class="soon-link">Entérate primero en <a href="https://www.instagram.com/ednamiau/" rel="noopener">@ednamiau</a>.</p>
      </div>
    </article>
  </main>

  <footer class="store-footer">
    <a class="store-footer__back" href="index.html"><span aria-hidden="true">←</span> Volver al portafolio</a>
    <ul class="store-footer__tags">
      <li><a class="store-footer__tag" href="mailto:edna.sapi@gmail.com?subject=Tienda">edna.sapi@gmail.com</a></li>
      <li><a class="store-footer__tag" href="https://www.instagram.com/ednamiau/" rel="noopener">@ednamiau</a></li>
    </ul>

<!doctype html>
<html lang="es" class="no-js">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact — Edna Pedraza</title>
  <meta name="description" content="Contacto con Edna Pedraza, Directora Creativa y Estilista de Moda.">
  <meta name="theme-color" content="#baffbe">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="assets/fonts/Geist-Variable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/styles.css">
  <script>document.documentElement.className = document.documentElement.className.replace('no-js', 'js');</script>
  <script src="js/data.js" defer></script>
  <script src="js/main.js" defer></script>
</head>
<body class="page-contact" data-page="contact">
  <a class="skip-link" href="#main">Saltar al contenido</a>

  <header class="site-header">
    <a class="brand brand--plain" href="index.html">
      <h1 class="brand__name">Edna Pedraza</h1>
    </a>

    <button class="menu-toggle" type="button" data-menu-toggle aria-expanded="false" aria-controls="site-menu">
      <span class="menu-toggle__labels" aria-hidden="true">
        <span class="menu-toggle__label menu-toggle__label--menu">Menu</span>
        <span class="menu-toggle__label menu-toggle__label--close">Close</span>
      </span>
      <span class="visually-hidden">Menú</span>
    </button>
    <nav class="site-menu" id="site-menu" aria-label="Principal">
      <ul class="site-menu__list">
        <li class="site-menu__item" style="--i: 0"><a class="site-menu__link" href="index.html"><span>00.</span><span lang="en">Home</span></a></li>
        <li class="site-menu__item" style="--i: 1"><a class="site-menu__link" href="about.html"><span>01.</span><span lang="en">About</span></a></li>
        <li class="site-menu__item" style="--i: 2"><a class="site-menu__link" href="contact.html" aria-current="page"><span>02.</span><span lang="en">Contact</span></a></li>
        <li class="site-menu__item" style="--i: 3"><a class="site-menu__link" href="index.html"><span>03.</span><span lang="en">Works</span></a></li>
      </ul>
    </nav>
  </header>

  <main id="main" class="contact" tabindex="-1">
    <div class="contact__grid">
      <!-- Demo form: no action, no backend. main.js validates it locally and
           shows an inline message; nothing is ever sent. -->
      <form class="contact-form" data-contact-form novalidate aria-label="Formulario de contacto">
        <div class="field">
          <label class="field__label mono-label" for="f-nombre">Nombre</label>
          <input class="field__control" id="f-nombre" name="nombre" type="text" autocomplete="name"
                 placeholder="Nombre Apellido" required aria-describedby="f-nombre-error"
                 data-required-message="Escribe tu nombre.">
          <p class="field__error mono-label" id="f-nombre-error"></p>
        </div>
        <div class="field">
          <label class="field__label mono-label" for="f-correo">Correo</label>
          <input class="field__control" id="f-correo" name="correo" type="email" autocomplete="email"
                 placeholder="nombre@ejemplo.com" required aria-describedby="f-correo-error"
                 data-required-message="Escribe tu correo.">
          <p class="field__error mono-label" id="f-correo-error"></p>
        </div>
        <div class="field">
          <label class="field__label mono-label" for="f-mensaje">Mensaje</label>
          <textarea class="field__control" id="f-mensaje" name="mensaje" placeholder="Cuéntame tu idea…"
                    required aria-describedby="f-mensaje-error" data-minlength="10"
                    data-required-message="Escribe un mensaje."></textarea>
          <p class="field__error mono-label" id="f-mensaje-error"></p>
        </div>
        <button class="contact-form__submit" type="submit">Enviar</button>
        <p class="contact-form__status" data-form-status role="status" aria-live="polite"></p>
      </form>

      <div class="contact__aside">
        <p class="contact__hello">¡Conectemos!</p>
      </div>
    </div>

    <div class="contact__taglines">
      <p>De la idea al styling</p>
      <p>¡Escríbeme y armamos algo!</p>
    </div>
  </main>
</body>
</html>

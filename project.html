<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Edna Pedraza</title>
  <meta name="robots" content="noindex">
  <!-- Projects used to live at project.html?slug=<slug>; they are now static
       pages at /proyectos/<slug>. This keeps old links working. -->
  <script>
    (function () {
      var slug = new URLSearchParams(window.location.search).get('slug');
      window.location.replace(slug ? '/proyectos/' + encodeURIComponent(slug) : '/');
    })();
  </script>
</head>
<body>
  <p><a href="/">Edna Pedraza</a></p>
</body>
</html>
